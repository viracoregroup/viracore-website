<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ViraCore — The Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --tan:#EDE5DA;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --orange:#FF7A3D;
    --gray:#8A867E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* NAV */
  nav{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:32px 60px;
    max-width:1400px;
    margin:0 auto;
  }
  .nav-left, .nav-right{
    display:flex;
    gap:32px;
    list-style:none;
  }
  .nav-right{justify-content:flex-end;}
  .nav-left a, .nav-right a{
    color:var(--white);
    text-decoration:none;
    font-size:14px;
    opacity:0.7;
  }
  .nav-right a.active{opacity:1; color:var(--orange);}
  .nav-left a:hover, .nav-right a:hover{opacity:1;}
  .logo-mark{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-mark img{
    height:40px;
    width:auto;
    display:block;
  }

  /* MAIN */
  .main{
    max-width:1400px;
    margin:0 auto;
    padding:100px 60px 140px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:100px;
    align-items:start;
  }

  .headline{
    font-size:clamp(46px, 5.5vw, 84px);
    font-weight:900;
    line-height:1.02;
    letter-spacing:-0.02em;
    margin-bottom:28px;
  }
  .subtext{
    font-size:15px;
    color:var(--gray);
    line-height:1.7;
    max-width:400px;
    margin-bottom:56px;
  }

  .email-block{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:36px;
  }
  .email-block svg{
    width:22px;
    height:22px;
    stroke:var(--orange);
    fill:none;
    stroke-width:1.6;
    flex-shrink:0;
  }
  .email-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gray);
    margin-bottom:6px;
  }
  .email-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .email-row a{
    color:var(--white);
    font-weight:700;
    font-size:17px;
    text-decoration:none;
  }
  .email-row svg{
    width:14px;
    height:14px;
    stroke:var(--orange);
    fill:none;
    stroke-width:2;
  }

  .divider{
    border-top:1px solid rgba(255,255,255,0.14);
    max-width:400px;
  }

  /* FORM */
  form{width:100%;}
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-bottom:24px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gray);
    margin-bottom:10px;
  }
  .field input, .field textarea{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(255,255,255,0.25);
    color:var(--white);
    font-size:15px;
    padding:10px 0;
    font-family:inherit;
    outline:none;
  }
  .field input::placeholder, .field textarea::placeholder{color:#5A5750;}
  .field input:focus, .field textarea:focus{border-bottom-color:var(--orange);}
  .field-message{margin-bottom:44px;}
  .field-message textarea{resize:none; min-height:90px;}

  .btn-submit{
    width:100%;
    background:var(--white);
    color:var(--black);
    border:none;
    padding:18px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
  }

  /* CHECKERBOARD ACCENT */
  .checker{
    position:fixed;
    bottom:0;
    left:0;
    width:64px;
    height:64px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    z-index:5;
  }
  .checker div:nth-child(1){background:var(--tan);}
  .checker div:nth-child(2){background:var(--black);}
  .checker div:nth-child(3){background:var(--black);}
  .checker div:nth-child(4){background:var(--white);}

  @media (max-width:900px){
    .main{grid-template-columns:1fr; gap:60px; padding:60px 24px 100px;}
    nav{grid-template-columns:1fr; gap:16px; padding:24px;}
    .nav-left, .nav-right{justify-content:center; flex-wrap:wrap;}
    .field-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<nav>
  <ul class="nav-left">
    <li><a href="index.html">Home</a></li>
    <li><a href="the-services2.html">The Services</a></li>
    <li><a href="the-story2.html">The Story</a></li>
  </ul>
  <div class="logo-mark"><img src="logo-white.png" alt="ViraCore" class="logo-img"></div>
  <ul class="nav-right">
    <li><a href="the-purpose2.html">The Purpose</a></li>
    <li><a href="the-contact2.html" class="active">The Contact</a></li>
  </ul>
</nav>

<div class="main">
  <div>
    <h1 class="headline">Let's get<br>started.</h1>
    <p class="subtext">Ready to work with ViraCore? Reach out and let us know what you need. We're already there.</p>

    <div class="email-block">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      <div>
        <div class="email-label">Send Us An Email</div>
        <div class="email-row">
          <a href="mailto:info@viracoregroup.com">info@viracoregroup.com</a>
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>
        </div>
      </div>
    </div>

    <div class="divider"></div>
  </div>

  <div>
    <form>
      <div class="field-grid">
        <div class="field">
          <label>Full Name</label>
          <input type="text" placeholder="Your full name">
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" placeholder="example@youremail.com">
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" placeholder="(123) 456 - 789">
        </div>
        <div class="field">
          <label>Subject</label>
          <input type="text" placeholder="How can we help?">
        </div>
      </div>

      <div class="field field-message">
        <label>Message</label>
        <textarea placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message →</button>
    </form>
  </div>
</div>

<div class="checker">
  <div></div><div></div><div></div><div></div>
</div>

</body>
</html>
